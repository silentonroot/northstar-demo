name: northstar

services:
  northstar:
    build: .
    image: northstar-demo:local
    # Published on the loopback interface only; the app is not reachable from other machines.
    ports:
      - '127.0.0.1:4100:4100'
    environment:
      NORTHSTAR_SESSION_TTL_SECONDS: '3600'
      NORTHSTAR_COOKIE_SECURE: 'false'
      NORTHSTAR_LOG_LEVEL: info
    volumes:
      - northstar-data:/data
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped

volumes:
  northstar-data:
